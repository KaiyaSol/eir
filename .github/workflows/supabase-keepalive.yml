# Keeps the Supabase project awake. Free-plan projects are paused after ~7 days
# without activity, which takes the app's login and data offline (this is what
# failed App Review in October 2026). A tiny database read every 2 days counts
# as activity. Upgrading the project to a paid plan makes this unnecessary.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              — same value as VITE_SUPABASE_URL in .env
#   SUPABASE_PUBLISHABLE_KEY  — same value as VITE_SUPABASE_PUBLISHABLE_KEY in .env
#
# If a run fails (e.g. the project was paused anyway), GitHub emails the repo
# owner — restore the project from the Supabase dashboard.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 9 */2 * *' # 09:00 UTC every 2 days
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY repository secret." >&2
            exit 1
          fi
          # Row-level security returns no rows to an anonymous request, but the
          # query still reaches Postgres, which is what counts as activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          [ "$status" = "200" ]
